name: Build container image

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      docker_push: ${{ steps.init.outputs.docker_push }}
      amd64: ${{ matrix.arch == 'amd64' && steps.build.outputs.digest || '' }}
      arm64: ${{ matrix.arch == 'arm64' && steps.build.outputs.digest || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - &initialize
        name: Initialize
        id: init
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Determine whether to push to Docker Hub based on the event type
          case "$EVENT_NAME" in
            push)
              DOCKER_PUSH=true ;;
            *)
              DOCKER_PUSH=false ;;
          esac

          # Map git ref branch or tag name to Docker tag version
          case "$GIT_REF" in
            # Do not push upstream branches and tags to Docker Hub
            refs/heads/upstream/*|refs/tags/upstream/*)
              DOCKER_PUSH=false ;;

            # Do not push pull request branches
            refs/pulls/*)
              DOCKER_PUSH=false ;;
          esac

          echo "docker_push=$DOCKER_PUSH" >> "$GITHUB_OUTPUT"
          echo "docker_repo=whoi/$(basename "$REPOSITORY" | tr A-Z a-z)" >> "$GITHUB_OUTPUT"

      - &metadata
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.init.outputs.docker_repo }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - &login
        name: Log into registry
        if: steps.init.outputs.docker_push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.init.outputs.docker_repo }},push-by-digest=true,name-canonical=true,push=${{ steps.init.outputs.docker_push }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  publish:
    needs: build
    if: needs.build.outputs.docker_push == 'true'
    runs-on: ubuntu-latest
    steps:
      - *initialize
      - *metadata
      - *login
      - uses: docker/setup-buildx-action@v3

      - name: Publish multi-platform image
        env:
          IMAGE: ${{ steps.init.outputs.docker_repo }}
          TAGS: ${{ steps.meta.outputs.tags }}
          AMD64_DIGEST: ${{ needs.build.outputs.amd64 }}
          ARM64_DIGEST: ${{ needs.build.outputs.arm64 }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"
